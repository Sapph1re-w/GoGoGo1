name: Build Self-Use APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build signed APK with repo keystore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          printf 'MAPS_API_KEY=%s\nMAPS_SAFE_CODE=\n' "${{ secrets.MAPS_API_KEY }}" > local.properties
          echo "local.properties written"

      - name: Fix keystore path for Linux
        run: |
          python3 -c "import pathlib;p=pathlib.Path('app/build.gradle');t=p.read_text();t2=t.replace(chr(92)*2+'keystore'+chr(92)*2+'GoGoGo.jks','/keystore/GoGoGo.jks');p.write_text(t2);print('changed:', t!=t2)"

      - name: Grant gradle permission
        run: chmod +x gradlew

      - name: Build release
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gogogo-selfuse-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
